<title>The Five Space – Contacts</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
:root{--navy:#14224a;--red:#d62839;--ice:#eef1f8;--ink:#1b2233;--muted:#5b6682;--line:#d9dfec;
--head:"Bricolage Grotesque","Trebuchet MS",Arial,sans-serif;--body:"Figtree","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--ice);color:var(--ink);font-size:16px;line-height:1.5}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
header{background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:8px 16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:800;color:var(--navy);line-height:1.1}
.brand img{height:40px;width:auto}
.brand small{display:block;color:var(--red);font-size:12px;letter-spacing:.08em}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;background:var(--red);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{background:#b81f2f}
.sec{background:var(--ice);color:var(--navy)}
.sec:hover{background:var(--line)}
.mini{padding:7px 12px;font-size:14px;border-radius:8px}
nav{display:flex;gap:6px;background:#fff;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
nav button{background:transparent;color:var(--navy);padding:9px 16px}
nav button:hover{background:var(--ice)}
nav button.on{background:var(--navy);color:#fff}
main{max-width:900px;margin:0 auto;padding:20px 14px 60px}
h1{font-family:var(--head);color:var(--navy);font-size:28px;margin-bottom:14px}
h2{font-family:var(--head);color:var(--navy);font-size:19px;margin:22px 0 8px}
h2 span{color:var(--muted);font-weight:600;font-size:16px}
.note{background:#fff3cd;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.box{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
form.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
label{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
input,select{font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:#fff;border-radius:14px;padding:14px 16px;border-left:5px solid var(--red)}
.stat b{display:block;font-family:var(--head);font-size:28px;color:var(--navy)}
.stat span{color:var(--muted);font-size:14px}
.card{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;display:grid;gap:10px}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card b{color:var(--navy)}
.card small{color:var(--muted);display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row select,.row input{width:auto;padding:7px 10px;font-size:14px}
.empty{color:var(--muted);padding:6px 0}
.bar{height:10px;background:var(--ice);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--red)}
.src{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.src:last-child{border:0}
#login{max-width:340px;margin:8vh auto;padding:0 18px;text-align:center}
#login img{width:150px;margin-bottom:8px}
#login .box{display:grid;gap:12px;text-align:left}
#err{color:var(--red);font-size:14px}
</style>
</head>

<script>
/* Pour partager les contacts avec l'équipe : coller ici la config Firebase du projet
   the-five-space-coworking (la même que dans l'application de gestion financière). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAPbTJfncLqn_pejgRxLkH-Pj56qq1ioeQ",
  authDomain: "the-five-space-coworking.firebaseapp.com",
  projectId: "the-five-space-coworking"
};

const SRC=["Facebook","TikTok","Google Ads","Instagram","WhatsApp","Recommandation","Passage à l’espace","Autre"];
const ETA=["Nouveau contact","Visite prévue","Client","Perdu"];
const CLOS=["Client","Perdu"];
const MSG={
 "Nouveau contact":"Bonjour {nom}, merci de votre intérêt pour The Five Space Coworking, à Mrezga (Hammamet Nord). Souhaitez-vous visiter l’espace ?",
 "Visite prévue":"Bonjour {nom}, je vous confirme votre visite à The Five Space Coworking. À très bientôt !",
 "Client":"Bonjour {nom}, merci pour votre confiance ! N’hésitez pas à nous écrire si vous avez besoin de quoi que ce soit.",
 "Perdu":"Bonjour {nom}, nous restons disponibles si vous souhaitez découvrir The Five Space Coworking."
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const plus=n=>iso(new Date(Date.now()+n*864e5));
let data=[],db=null,cur="auj";

function load(){
  if(db){db.collection("contacts").onSnapshot(s=>{data=s.docs.map(d=>({id:d.id,...d.data()}));draw();},()=>{});}
  else{try{data=JSON.parse(localStorage.getItem("five_contacts")||"[]");}catch(e){data=[];}}
  draw();
}
function persist(){if(!db){try{localStorage.setItem("five_contacts",JSON.stringify(data));}catch(e){}}}
function add(o){if(db)db.collection("contacts").add(o);else{o.id=String(Date.now());data.push(o);persist();draw();}}
function upd(id,p){if(db)db.collection("contacts").doc(id).update(p);else{Object.assign(data.find(x=>x.id===id),p);persist();draw();}}
function del(id){if(db)db.collection("contacts").doc(id).delete();else{data=data.filter(x=>x.id!==id);persist();draw();}}

function wa(c){
  let t=String(c.tel||"").replace(/\D/g,"");if(t.length===8)t="216"+t;
  return "https://wa.me/"+t+"?text="+encodeURIComponent((MSG[c.etape]||MSG["Nouveau contact"]).replace("{nom}",c.nom));
}
const waBtn=c=>c.tel?`<a class="btn mini" href="${wa(c)}">WhatsApp</a>`:"";

function auj(){
  const t=today(),a=data.filter(c=>!CLOS.includes(c.etape)&&c.relance&&c.relance<=t).sort((x,y)=>x.relance>y.relance?1:-1);
  const st=(v,l)=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  return `<h1>Aujourd’hui</h1>
  <div class="stats">${st(a.length,"À relancer")}${st(data.filter(c=>c.etape==="Nouveau contact").length,"Nouveaux contacts")}${st(data.filter(c=>c.etape==="Visite prévue").length,"Visites prévues")}${st(data.filter(c=>c.etape==="Client").length,"Clients")}</div>
  <h2>À relancer</h2>
  ${a.length?a.map(c=>`<div class="card"><div class="top"><div><b>${esc(c.nom)}</b><small>${esc(c.etape)} · ${esc(c.source)}${c.note?" · "+esc(c.note):""}</small></div>${waBtn(c)}</div>
  <div class="row"><button class="sec mini" data-a="fait" data-id="${c.id}">Relancé, rappeler dans 3 jours</button><button class="mini" data-a="client" data-id="${c.id}">Devenu client</button></div></div>`).join(""):'<div class="box empty">Personne à relancer aujourd’hui. Ajoutez des contacts dans l’onglet Contacts.</div>'}`;
}

function contacts(){
  const f=`<form class="box add">
   <label>Nom<input name="nom" required></label>
   <label>Téléphone<input name="tel" type="tel" inputmode="tel"></label>
   <label>Réseau<select name="source">${SRC.map(s=>`<option>${s}</option>`).join("")}</select></label>
   <label>Note<input name="note"></label>
   <button>Ajouter le contact</button></form>`;
  return `<h1>Contacts</h1>${f}`+ETA.map(e=>{
    const l=data.filter(c=>c.etape===e);
    return `<h2>${e} <span>${l.length}</span></h2>`+(l.length?l.map(c=>`<div class="card"><div class="top"><div><b>${esc(c.nom)}</b><small>${esc(c.source)}${c.tel?" · "+esc(c.tel):""}${c.note?" · "+esc(c.note):""}</small></div>${waBtn(c)}</div>
     <div class="row"><select data-id="${c.id}" data-f="etape" aria-label="Étape">${ETA.map(x=>`<option${x===c.etape?" selected":""}>${x}</option>`).join("")}</select>
     ${CLOS.includes(c.etape)?"":`<label style="display:flex;align-items:center;gap:6px">Relance <input type="date" data-id="${c.id}" data-f="relance" value="${esc(c.relance)}"></label>`}
     ${c.etape==="Client"?`<button class="sec mini" data-a="annul" data-id="${c.id}">Annuler client</button>`:`<button class="mini" data-a="client" data-id="${c.id}">Devenu client</button>`}
     <button class="sec mini" data-a="del" data-id="${c.id}">Supprimer</button></div></div>`).join(""):'<div class="empty">Aucun contact à cette étape.</div>');
  }).join("");
}

function sources(){
  const r=SRC.map(s=>{const l=data.filter(c=>c.source===s),k=l.filter(c=>c.etape==="Client").length;return{s,n:l.length,k};}).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  const max=Math.max(1,...r.map(x=>x.n));
  return `<h1>Réseaux</h1><p style="color:var(--muted);margin-bottom:12px">D’où viennent vos contacts, et lesquels deviennent clients.</p>
  <div class="box">${r.length?r.map(x=>`<div class="src"><b>${esc(x.s)}</b><span>${x.n} contact${x.n>1?"s":""} · ${x.k} client${x.k>1?"s":""} · ${Math.round(x.k/x.n*100)} %</span><div class="bar" style="grid-column:1/3"><i style="width:${x.n/max*100}%"></i></div></div>`).join(""):'<p class="empty">Ajoutez des contacts pour voir quel réseau vous en apporte le plus.</p>'}</div>`;
}

const VIEWS={auj:["Aujourd’hui",auj],contacts:["Contacts",contacts],sources:["Réseaux",sources]};
function draw(){
  const k=cur;
  $("#tabs").innerHTML=Object.entries(VIEWS).map(([id,v])=>`<button data-tab="${id}" class="${id===k?"on":""}">${v[0]}</button>`).join("");
  const f=document.activeElement;
  if(f&&f.closest&&f.closest("form.add"))return;
  $("#main").innerHTML=(db?"":'<p class="note">Mode essai : les contacts restent sur cet appareil. Branchez Firebase pour les partager avec l’équipe.</p>')+VIEWS[k][1]();
}

$("#main").addEventListener("submit",e=>{
  e.preventDefault();const o={};
  new FormData(e.target).forEach((v,n)=>{o[n]=v.trim();});
  o.etape="Nouveau contact";o.relance=plus(1);o.creation=today();
  add(o);e.target.reset();
});
$("#main").addEventListener("change",e=>{
  const t=e.target,id=t.dataset.id;if(!id)return;
  if(t.dataset.f==="etape")upd(id,{etape:t.value,relance:CLOS.includes(t.value)?"":plus(2)});
  if(t.dataset.f==="relance")upd(id,{relance:t.value});
});
$("#main").addEventListener("click",e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  if(b.dataset.a==="del"&&confirm("Supprimer ce contact ?"))del(b.dataset.id);
  if(b.dataset.a==="fait")upd(b.dataset.id,{relance:plus(3)});
  if(b.dataset.a==="client")upd(b.dataset.id,{etape:"Client",relance:""});
  if(b.dataset.a==="annul")upd(b.dataset.id,{etape:"Nouveau contact",relance:plus(1)});
});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;cur=b.dataset.tab;if(document.activeElement)document.activeElement.blur();draw();window.scrollTo(0,0);});

if(FIREBASE_CONFIG&&typeof firebase!=="undefined"){
  firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();const au=firebase.auth();
  $("#out").hidden=false;$("#out").onclick=()=>au.signOut();
  au.onAuthStateChanged(u=>{$("#login").hidden=!!u;$("#app").hidden=!u;if(u)load();});
  $("#lf").addEventListener("submit",e=>{e.preventDefault();$("#err").textContent="";
    au.signInWithEmailAndPassword($("#le").value,$("#lp").value).catch(()=>{$("#err").textContent="E-mail ou mot de passe incorrect.";});});
}else{$("#app").hidden=false;load();}
</script>
</body>
</html>
