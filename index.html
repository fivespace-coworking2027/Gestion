<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Five Space – Gestion financière</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#14213d;--mut:#6b7488;--ac:#14284b;--rd:#d62839;--gr:#14284b;--bd:#e1e5ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f121a;--card:#181d2a;--tx:#eef0f6;--mut:#98a0b5;--ac:#7f9bff;--rd:#ff6b78;--gr:#7f9bff;--bd:#2a3144}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif}
main{max-width:680px;margin:0 auto;padding:16px}
.brand{display:flex;justify-content:center;margin-bottom:4px}.brand img{width:140px;height:auto;border-radius:14px;background:#fff}
.sub{text-align:center;font-size:12px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,33,61,.06)}
h2{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.k{font-size:13px;color:var(--mut)}.g{color:var(--gr)}.r{color:var(--rd)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi div b{display:block;font-size:20px}
.net{grid-column:1/3;border-top:1px solid var(--bd);padding-top:8px}.net b{font-size:30px!important}
input,select{width:100%;padding:13px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700;margin-top:6px}
:root[data-theme=dark] .btn{color:#0f121a}@media(prefers-color-scheme:dark){.btn{color:#0f121a}}
.btn.s{width:auto;padding:8px 12px;margin:0;font-size:14px;background:none;color:var(--ac);border:1px solid var(--bd)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}.seg button{padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-weight:700}
.seg button.on.rec{background:var(--gr);color:#fff;border-color:var(--gr)}@media(prefers-color-scheme:dark){.seg button.on.rec{color:#0f121a}}.seg button.on.dep{background:var(--rd);color:#fff;border-color:var(--rd)}
.line{display:flex;justify-content:space-between;padding:4px 0;font-size:15px}.line.h{font-weight:700;border-top:1px solid var(--bd);margin-top:4px;padding-top:8px}
.bar{height:6px;border-radius:6px;margin:0 0 6px}
.tb{display:grid;grid-template-columns:.9fr 1fr 1fr 1fr;gap:4px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}.tb span:not(:first-child),.tb b{text-align:right}.tb.h{font-weight:700;font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.3px}.tb.t{text-transform:none;color:var(--tx);font-size:15px;border-top:2px solid var(--ac);border-bottom:0;letter-spacing:0}
.day{font-weight:700;margin-top:12px;display:flex;justify-content:space-between}
#form{display:none}
@media print{.noprint,#form,.btn,nav{display:none!important}body{background:#fff}.card{box-shadow:none}}

<div id="login" class="card" style="display:none"><h2>Connexion</h2><input id="lem" type="email" placeholder="E-mail"><input id="lpw" type="password" placeholder="Mot de passe"><div class="r k" id="lerr"></div><button class="btn" onclick="login()">Se connecter</button></div><div class="sub">Gestion financière</div>
<nav class="row noprint" style="margin-bottom:10px"><button class="btn s" onclick="mv(-1)">◀</button><b id="mlabel"></b><button class="btn s" onclick="mv(1)">▶</button></nav>
<div class="card"><h2 id="mt">Mois</h2><div class="kpi"><div><span class="k">Recettes</span><b class="g" id="mr"></b></div><div><span class="k">Dépenses</span><b class="r" id="md"></b></div><div class="net"><span class="k">Bénéfice net du mois</span><b id="mn"></b></div></div><div class="k" id="info" style="margin-top:6px"></div></div>
<div class="card"><h2 id="yt">Année</h2><div class="kpi"><div><span class="k">Recettes</span><b class="g" id="yr"></b></div><div><span class="k">Dépenses</span><b class="r" id="yd"></b></div><div class="net"><span class="k">Bénéfice net de l'année</span><b id="yn"></b></div></div><div class="k" style="margin-top:12px">Détail par mois (en DT)</div><div id="ytab"></div></div>
<div class="card" id="byR"></div><div class="card" id="byD"></div>
<button class="btn noprint" id="addbtn" onclick="tf()">+ Ajouter une opération</button>
<div class="card" id="form" style="margin-top:12px">
<div class="seg" id="segw"><button id="sr" class="rec on" onclick="sk('rec')">Recette</button><button id="sd" class="dep" onclick="sk('dep')">Dépense</button></div>
<input id="rdate" type="date" min="2027-01-01"><select id="rtype"></select>
<input id="ramt" type="number" inputmode="decimal" placeholder="Montant en DT"><input id="rnote" placeholder="Note (facultatif)">
<button class="btn" id="sv" onclick="add()">Enregistrer</button></div>
<button class="btn noprint" style="background:none;color:var(--ac);border:1px solid var(--bd)" onclick="window.print()">Imprimer le rapport (PDF)</button>
<button class="btn s noprint" style="margin-top:8px" onclick="firebase.auth().signOut().then(()=>location.reload())">Se déconnecter</button><div id="list" style="margin-top:6px">Chargement…</div></main>
<script>
// Configuration Firebase
const FIREBASE_CONFIG={apiKey:"AIzaSyAPbTJfncLqn_pejgRxLkH-Pj56qq1ioeQ",authDomain:"the-five-space-coworking.firebaseapp.com",projectId:"the-five-space-coworking",storageBucket:"the-five-space-coworking.firebasestorage.app",messagingSenderId:"243679616831",appId:"1:243679616831:web:2815d017f31288f9b5fd8a"};
addEventListener('unhandledrejection',()=>alert("Action non autorisée avec ce compte."));
async function login(){try{await firebase.auth().signInWithEmailAndPassword($('lem').value.trim(),$('lpw').value);location.reload()}catch(e){$('lerr').textContent='E-mail ou mot de passe incorrect.'}}
const START='2027-01',T={rec:['Pass journée','Abonnement mensuel','Bureau dédié','Salle de réunion','Formation','Préparation CV et entretiens','Café / boissons','Autre service (à préciser en note)'],
dep:['Salaires','Électricité et eau','Internet et téléphone','Fournitures et achats','Achats café / boissons','Entretien et ménage','Marketing et publicité','Impôts et taxes','Autre dépense (à préciser en note)']};
let db=null,R=[],D=[],ready=false,kind='rec',M=new Date().toISOString().slice(0,7);if(M<START)M=START;
const fmt=n=>(Math.round(n*1000)/1000).toLocaleString('fr-FR')+' DT';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id),sum=l=>l.reduce((s,r)=>s+Number(r.amount||0),0);
const today=()=>{const t=new Date().toISOString().slice(0,10);return t<'2027-01-01'?'2027-01-01':t};
const cls=n=>n>=0?'g':'r';const nf=n=>(Math.round(n*1000)/1000).toLocaleString('fr-FR');
function sk(k){kind=k;$('sr').className='rec'+(k=='rec'?' on':'');$('sd').className='dep'+(k=='dep'?' on':'');$('rtype').innerHTML=T[k].map(t=>`<option>${t}</option>`).join('')}
let ED=null;
function tf(){const f=$('form'),o=f.style.display==='block';ED=null;$('segw').style.display='grid';$('sv').textContent='Enregistrer';f.style.display=o?'none':'block';$('addbtn').textContent=o?'+ Ajouter une opération':'Fermer';$('rdate').value=today();$('ramt').value='';$('rnote').value='';sk(kind)}
function ed(k,id){const x=(k=='rec'?R:D).find(r=>r.id===id);if(!x)return;kind=k;ED={k,id};sk(k);$('segw').style.display='none';$('form').style.display='block';$('addbtn').textContent='Fermer';$('rdate').value=x.date;$('rtype').value=x.type;$('ramt').value=x.amount;$('rnote').value=x.note||'';$('sv').textContent='Enregistrer les modifications';$('form').scrollIntoView({behavior:'smooth'})}
function mv(n){const [y,m]=M.split('-').map(Number),d=new Date(y,m-1+n,1),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(k>=START)M=k;draw()}
async function init(){
  try{firebase.initializeApp(FIREBASE_CONFIG)}catch(e){$('list').textContent='Configuration manquante.';return}
  const U=await new Promise(r=>{const u=firebase.auth().onAuthStateChanged(x=>{u();r(x)})});
  if(!U){document.body.className='out';$('login').style.display='block';return}
  db=firebase.firestore();
  const t=setTimeout(()=>{if(!ready)$('list').textContent='Connexion lente… vérifie internet.'},10000);
  const f=s=>s.docs.map(d=>({id:d.id,...(d.data?d.data():d)}));
  db.collection('recettes').onSnapshot(s=>{R=f(s);ready=true;clearTimeout(t);draw()});
  db.collection('depenses').onSnapshot(s=>{D=f(s);draw()});
}
function brk(el,title,l,col){const tot=sum(l),ty=[...new Set(l.map(r=>r.type))].map(t=>[t,sum(l.filter(r=>r.type===t))]).sort((a,b)=>b[1]-a[1]);
  $(el).style.display=ty.length?'block':'none';
  $(el).innerHTML=`<h2>${title}</h2>`+ty.map(([t,v])=>`<div class="line"><span>${esc(t)}</span><b>${fmt(v)}</b></div><div class="bar" style="width:${Math.max(3,v/tot*100)}%;background:var(--${col})"></div>`).join('')}
function draw(){
  const [y,m]=M.split('-'),Y=M.slice(0,4);
  const mn=new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  $('mlabel').textContent=mn;$('mt').textContent=mn;$('yt').textContent='Année '+Y;
  const cr=R.filter(r=>r.date.startsWith(M)),cd=D.filter(r=>r.date.startsWith(M)),yr=R.filter(r=>r.date.startsWith(Y)),yd=D.filter(r=>r.date.startsWith(Y));
  const a=sum(cr),b=sum(cd),c=a-b;
  $('mr').textContent=fmt(a);$('md').textContent=fmt(b);$('mn').textContent=fmt(c);$('mn').className=cls(c);
  const days=new Set(cr.map(r=>r.date));$('info').textContent=days.size?`${days.size} jour(s) d'activité · recette moyenne ${fmt(a/days.size)} / jour`+(a>0?` · marge ${Math.round(c/a*100)} %`:''):'Aucune opération ce mois-ci';
  const A=sum(yr),B=sum(yd),C=A-B;
  $('yr').textContent=fmt(A);$('yd').textContent=fmt(B);$('yn').textContent=fmt(C);$('yn').className=cls(C);
  $('ytab').innerHTML='<div class="tb h"><span>Mois</span><span>Recettes</span><span>Dépenses</span><span>Bénéfice</span></div>'+Array.from({length:12},(_,i)=>{const k=Y+'-'+String(i+1).padStart(2,'0'),x=sum(yr.filter(r=>r.date.startsWith(k))),z=sum(yd.filter(r=>r.date.startsWith(k)));
    return `<div class="tb"><span>${new Date(Y,i,1).toLocaleDateString('fr-FR',{month:'short'})}</span><span class="g">${nf(x)}</span><span class="r">${nf(z)}</span><b class="${cls(x-z)}">${nf(x-z)}</b></div>`}).join('')+`<div class="tb h t"><span>Total</span><span class="g">${nf(A)}</span><span class="r">${nf(B)}</span><b class="${cls(C)}">${nf(C)}</b></div>`;
  brk('byR','Recettes par service',cr,'gr');brk('byD','Dépenses par catégorie',cd,'rd');
  const all=[...cr.map(x=>({...x,k:'rec'})),...cd.map(x=>({...x,k:'dep'}))],ds=[...new Set(all.map(x=>x.date))].sort().reverse();
  $('list').innerHTML=ds.map(d=>{const e=all.filter(x=>x.date===d),net=sum(e.filter(x=>x.k=='rec'))-sum(e.filter(x=>x.k=='dep'));
    return `<div class="day"><span>${new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</span><span class="${cls(net)}">${fmt(net)}</span></div>`+
    e.map(x=>`<div class="card row" style="margin:6px 0"><div><b class="${x.k=='rec'?'g':'r'}">${x.k=='rec'?'+':'−'} ${fmt(x.amount)}</b> · ${esc(x.type)}<div class="k">${esc(x.note)}</div></div><span class="noprint" style="white-space:nowrap"><button class="btn s" onclick="ed('${x.k}','${x.id}')">Modifier</button> <button class="btn s" onclick="del('${x.k}','${x.id}')">✕</button></span></div>`).join('')}).join('');
}
async function add(){
  const a=Number($('ramt').value),d=$('rdate').value;if(!a||!d||d<'2027-01-01')return;
  const o={date:d,type:$('rtype').value,amount:a,note:$('rnote').value.trim()};
  if(ED)await db.doc((ED.k=='rec'?'recettes/':'depenses/')+ED.id).set(o);else await db.collection(kind=='rec'?'recettes':'depenses').add(o);
  $('ramt').value='';$('rnote').value='';M=d.slice(0,7);tf();
}
const del=(k,id)=>confirm('Supprimer cette opération ?')&&db.doc((k=='rec'?'recettes/':'depenses/')+id).delete();
init();
</script></body></html>
